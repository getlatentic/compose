<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Compose</title>
    <script>
      /*
       * The saved appearance, set before the first pixel. The stylesheet below
       * and the native window both paint before any module runs, so without
       * this a dark-mode user sees a white skeleton flash on every launch, and
       * anyone who has zoomed or dragged a pane sees the layout jump the moment
       * React takes over. Mirrors `applyTheme` / `applyZoom` and the pane
       * widths in src/app/store/uiStore.ts; the key is UI_PREFS_KEY in
       * src/lib/prefs/uiPrefs.ts. An absent value deliberately sets nothing, so
       * the defaults below decide.
       */
      try {
        var prefs = JSON.parse(localStorage.getItem("compose.uiPrefs.v1") || "{}");
        var root = document.documentElement;
        if (prefs.theme === "dark" || prefs.theme === "light") {
          root.setAttribute("data-theme", prefs.theme);
        }
        if (typeof prefs.zoom === "number" && prefs.zoom > 0) {
          root.style.setProperty("--ui-zoom", String(prefs.zoom));
        }
        if (typeof prefs.sidebarWidthPx === "number" && prefs.sidebarWidthPx > 0) {
          root.style.setProperty("--splash-sidebar-w", prefs.sidebarWidthPx + "px");
        }
        if (typeof prefs.chatWidthPx === "number" && prefs.chatWidthPx > 0) {
          root.style.setProperty("--splash-chat-w", prefs.chatWidthPx + "px");
        }
        if (prefs.focusMode === true) {
          root.setAttribute("data-splash-focus", "");
        }
      } catch (e) {
        /* private mode, cleared storage — fall through to the defaults */
      }
    </script>
    <style>
      /*
       * Pre-React skeleton of the three-pane shell (sidebar | editor | chat),
       * empty but for the pane dividers — so the very first paint is the app's
       * own structure and the real UI fills into it with no flash or swap. (A
       * brand splash only blinked for ~100ms before the app on a fast boot and
       * read as a flash.) Kept inline so it ships in the first HTML payload —
       * no CSS round-trip, no flash of unstyled content — and mirrored in
       * global.scss for the React <SplashScreen/>.
       *
       * The column template + divider colour match
       * `.workspace--editor-open.workspace--chat-open` in global.scss, so the
       * dividers land exactly where the real panes' dividers will and content
       * fills in without a shift.
       */
      :root {
        color-scheme: light;
        --ui-zoom: 1;
        --splash-bg: #ffffff;
        --splash-fg: #161616;
        --splash-divider: #c6c6c6;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --splash-bg: #161616;
          --splash-fg: #f4f4f4;
          --splash-divider: #525252;
        }
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --splash-bg: #161616;
        --splash-fg: #f4f4f4;
        --splash-divider: #525252;
      }
      html {
        /* Same rule global.scss applies, so the skeleton's rem-based columns
           are already at the user's interface scale. */
        font-size: calc(100% * var(--ui-zoom));
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--splash-bg);
        /* Matches the app's single UI stack ($ui-font in global.scss):
           IBM Plex isn't bundled, so the chrome uses system-ui everywhere. */
        font-family: system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, sans-serif;
        color: var(--splash-fg);
      }
      #root {
        height: 100%;
      }
      /* Above React's root, and removed the moment the window opens. Only ever
         seen if a launch runs past the deadline in launch_window.rs. */
      #boot-shell {
        position: fixed;
        inset: 0;
        z-index: 2;
      }
      .app-skeleton {
        position: fixed;
        inset: 0;
        display: grid;
        grid-template-columns:
          var(--splash-sidebar-w, 15rem) minmax(17rem, 1fr) var(--splash-chat-w, 22rem);
        background: var(--splash-bg);
      }
      /* Focus mode hides both side panes, so a skeleton showing three would
         collapse to one as React takes over. */
      :root[data-splash-focus] .app-skeleton {
        grid-template-columns: minmax(0, 1fr);
      }
      :root[data-splash-focus] .app-skeleton__pane--sidebar,
      :root[data-splash-focus] .app-skeleton__pane--chat {
        display: none;
      }
      .app-skeleton__pane {
        min-inline-size: 0;
      }
      .app-skeleton__pane--sidebar {
        border-inline-end: 1px solid var(--splash-divider);
      }
      .app-skeleton__pane--chat {
        border-inline-start: 1px solid var(--splash-divider);
      }
      /* Below the workspace's 48rem breakpoint the real layout collapses to a
         single column — match it so the dividers aren't left mid-canvas. */
      @media (max-width: 48rem) {
        .app-skeleton {
          grid-template-columns: minmax(0, 1fr);
        }
        .app-skeleton__pane--sidebar,
        .app-skeleton__pane--chat {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <!-- Shown only if a launch runs past the deadline in launch_window.rs and
      the window has to open before the app is drawn. On a normal launch the
      window does not open until React is ready, and this is never seen. -->
    <div id="boot-shell">
      <div class="app-skeleton" aria-hidden="true">
        <div class="app-skeleton__pane app-skeleton__pane--sidebar"></div>
        <div class="app-skeleton__pane app-skeleton__pane--editor"></div>
        <div class="app-skeleton__pane app-skeleton__pane--chat"></div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      /*
       * Tell the native side the document is parsing. It is what marks the
       * moment the web view actually started, which is otherwise invisible
       * from the Rust side of the launch.
       */
      try {
        window.__TAURI_INTERNALS__.invoke("launch_document_parsed");
      } catch (e) {
        /* nothing depends on this */
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
